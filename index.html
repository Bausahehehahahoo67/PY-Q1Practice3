<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Practice 3</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

</head>
<body>
    <h1>PY-Numbers</h1>
    <br>

    <form action="">
         <input type="text" id="neckhurts" placeholder="Please enter a digit">
         <br>
         <input type="text" id="aurafarm" placeholder="Please enter a digit">
         <br>
         <button type="button" py-click="adding_numbers">Answer</button>

         <br>
         <input type="checkbox" id="item1" value="129">
               <label for="item1" id="label1"> Coffee</label>
         <br>   
         

         <br>
         
         <input type="radio" id="normal" name="size" value="0">
               <label for="normal"> Normal (+0) </label>

        <input type="radio" id="huge" name="size" value="30">
               <label for="huge"> Huge (+2) </label>
         <br>
         <button type="button" py-click="create_order">Order</button>
         
         <label for="Milo"> Milo </label>
         <select id="milo">
                <option value="0"> Choose </option>
                <option value="0"> Cold Milo </option>
                <option value="0"> Hot Milo </option>
                <option value="0"> Ice Cream Milo </option>
         </select>
         <br>
         <button type="button" py-click="create_order2">Order milo</button>
    </form>
 
    <div id="output"></div>
    <div id="output2"></div>
    <div id="output3"></div>
    <script type="py" src="main.py"></script>

</body>
</html>
